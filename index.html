    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #020617;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --glass-bg: rgba(15, 23, 42, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --scrollbar-track: #020617;
            --scrollbar-thumb: #1e293b;
            --scrollbar-thumb-hover: #334155;
        }

        [data-theme="pastel"] {
            --bg-primary: #fff0f5; /* Lavender Blush */
            --text-primary: #2d3748;
            --text-secondary: #4a5568;
            --glass-bg: rgba(255, 255, 255, 0.3);
            --glass-border: rgba(255, 255, 255, 0.5);
            --scrollbar-track: #fff0f5;
            --scrollbar-thumb: #cbd5e0;
            --scrollbar-thumb-hover: #a0aec0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            transition: background-color 0.5s ease, color 0.5s ease;
        }
        h1, h2, h3, .font-heading {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            transition: background 0.5s ease, border-color 0.5s ease;
        }
        .gradient-text {
            background: linear-gradient(to right, #60a5fa, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        [data-theme="pastel"] .gradient-text {
            background: linear-gradient(to right, #818cf8, #f472b6, #fbbf24);
             -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .bg-grid {
            background-size: 40px 40px;
            background-image: radial-gradient(circle, rgba(148, 163, 184, 0.1) 1px, transparent 1px);
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-thumb-hover);
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        /* Scroll Reveal System */
        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 1.2s cubic-bezier(0.2, 0.8, 0.2, 1), 
                        transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            will-change: transform, opacity;
        }
        .reveal-left {
            opacity: 0;
            transform: translateX(-40px);
            transition: opacity 1.2s cubic-bezier(0.2, 0.8, 0.2, 1), 
                        transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .reveal-right {
            opacity: 0;
            transform: translateX(40px);
            transition: opacity 1.2s cubic-bezier(0.2, 0.8, 0.2, 1), 
                        transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .revealed {
            opacity: 1 !important;
            transform: translate(0, 0) !important;
        }
        
        /* Staggered Delay Utilities */
        .delay-100 { transition-delay: 100ms; }
        .delay-200 { transition-delay: 200ms; }
        .delay-300 { transition-delay: 300ms; }
        .delay-400 { transition-delay: 400ms; }
        .delay-500 { transition-delay: 500ms; }
    </style>
